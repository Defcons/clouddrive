name: Build & deploy
# Builds the multi-arch container image, pushes it to GHCR, then (on master)
# deploys by PULLING that freshly-built image on the homelab host.
#
# `deploy` needs `build`, so the host always pulls the CURRENT commit's image
# (no one-push lag) and never builds locally — a cold host build OOM'd the small
# LXC. Pushing a tag (v*) only publishes an image; it does not deploy.
#
# Actions are SHA-pinned (audit M4). The `# vN` comment records the release.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          # metadata-action lowercases the image name → ghcr.io/defcons/clouddrive
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to homelab (pull the built image)
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Deploy via SSH over Tailscale
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: "10m"
          script: |
            set -e
            cd /opt/clouddrive
            # Fetch anonymously over HTTPS (the repo is public) to update compose/.env.
            git remote set-url origin https://github.com/Defcons/clouddrive.git
            git fetch origin
            git reset --hard origin/master
            git log -1 --oneline
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "WARNING: .env created from example — update credentials!"
            fi
            # Pull the image the build job just published and run it. Never build
            # on this host. Pull EXPLICITLY: `docker compose pull` skips services
            # with a build: section, and `--no-build` forbids a silent rebuild.
            docker pull ghcr.io/defcons/clouddrive:latest
            docker compose up -d --no-build --force-recreate
