name: Deploy CloudDrive
# Auto-deploys on push to master via Tailscale

on:
  push:
    branches:
      - master
  # Manual trigger — lets a deploy be verified deliberately instead of having to
  # push a dummy commit. Added 2026-07-30 alongside the move to a forced-command
  # deploy key (see homelab-config/security/SECURITY.md §5.4).
  workflow_dispatch:

# The deploy needs no GITHUB_TOKEN scopes (it fetches over anonymous HTTPS on the
# server), so start from zero and grant nothing.
permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Deploy via SSH over Tailscale
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # A from-scratch `docker compose up --build` on the host can exceed the
          # action's 10m default (esp. when a history rewrite busts the layer
          # cache). Give the cold rebuild room.
          command_timeout: "30m"
          script: |
            set -e
            cd /opt/clouddrive
            # The repo is public — fetch anonymously over HTTPS so the deploy
            # doesn't depend on a deploy key/token (a broken remote previously
            # made git fetch fail silently and ship stale code).
            git remote set-url origin https://github.com/Defcons/clouddrive.git
            git fetch origin
            git reset --hard origin/master
            git log -1 --oneline
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "WARNING: .env created from example — update credentials!"
            fi
            # Pull the prebuilt public image (build-image.yml publishes it) rather
            # than rebuilding on this small host — a cold host build OOM'd the LXC.
            # Pull EXPLICITLY: `docker compose pull` SKIPS services that have a
            # build: section, so it silently falls back to building. `--no-build`
            # then guarantees the deploy can never rebuild on the host.
            docker pull ghcr.io/defcons/clouddrive:latest
            docker compose up -d --no-build --force-recreate
