services:
  clouddrive:
    # Prod pulls this prebuilt multi-arch image (published by build-image.yml) so
    # the small host never has to rebuild. `build: .` stays for local dev
    # (`docker compose up --build`).
    image: ghcr.io/defcons/clouddrive:latest
    build: .
    container_name: clouddrive
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8080:8080"
    volumes:
      - /data:/data
    env_file:
      - .env
    environment:
      - STORAGE_ROOT=/data
      - PORT=8080

  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    hostname: clouddrive-server
    ports:
      - "8384:8384"    # Syncthing Web UI — SECURE IT WITH A GUI PASSWORD (Syncthing Settings → GUI), not by restricting the bind (loopback-only broke terminal-only admin access)
      - "22000:22000/tcp"  # Sync protocol (TCP)
      - "22000:22000/udp"  # Sync protocol (QUIC)
      - "21027:21027/udp"  # Discovery
    volumes:
      - /data:/var/syncthing/data
      - /opt/syncthing-config:/var/syncthing/config
    environment:
      - PUID=1000
      - PGID=1000
